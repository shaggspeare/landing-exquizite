          "@type": "Question",

            "@type": "Answer",
            "text": "Over 40 languages for both learning content and app interface."
          }
        },
        {
          "@type": "Question",
          "name": "Does the app work offline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, the iOS app supports offline access to your downloaded word sets."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Calleo on my computer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! The web app offers a desktop-optimized experience."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your sets live in our cloud database, and each account can only read its own data. Words and topics you send to the AI go to OpenAI to produce translations, transcriptions and examples; your email and account data do not. In guest mode nothing leaves your device except those AI requests."
          }
        },
        {
          "@type": "Question",
          "name": "Can I share my word sets?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Generate a shareable link for any set. Others can view and copy it to their collection."
          }
        },
        {
          "@type": "Question",
          "name": "What game modes does Calleo offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Six: Flashcards, Match, Quiz, Fill in the Blank, Listening, and Writing. Listening plays a word aloud for you to identify; Writing has you type the word from memory."
          }
        },
        {
          "@type": "Question",
          "name": "Can I import word lists from Wordwall?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Import your existing Wordwall sets directly into Calleo and start practicing right away."
          }
        },

          "@type": "Question",
          "name": "What is the CEFR Learn path?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Learn is a guided curriculum spanning all six CEFR levels, A1 through C2. Pass each quiz to automatically unlock the next focused set."
          }
        }
      ]
